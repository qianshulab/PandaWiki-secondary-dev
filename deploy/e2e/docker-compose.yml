version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pandawiki-e2e-postgres
    environment:
      POSTGRES_DB: panda-wiki
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: panda-wiki-secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki -d panda-wiki"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pandawiki-e2e-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pandawiki-e2e-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pandawiki-e2e-redis:/data

  nats:
    image: nats:2-alpine
    container_name: pandawiki-e2e-nats
    command:
      [
        "-js",
        "-m",
        "8222",
        "--store_dir",
        "/data",
        "--user",
        "panda-wiki",
        "--pass",
        "panda-wiki-secret",
      ]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pandawiki-e2e-nats:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pandawiki-e2e-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: panda-wiki-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pandawiki-e2e-minio:/data

volumes:
  pandawiki-e2e-postgres:
  pandawiki-e2e-redis:
  pandawiki-e2e-nats:
  pandawiki-e2e-minio:
